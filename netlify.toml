[build]
  command = "cd frontend && corepack enable && yarn install --immutable && yarn build"
  publish = "frontend/packages/webapp/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NODE_OPTIONS = "--max-old-space-size=4096"
  APP_CONFIG_TYPE = "remote"
  APP_CONFIG_JSON = '{"type":"remote","url":"/api/restful/app/config"}'

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pg-native"]

# API & OAuth function rewrites MUST precede the SPA catch-all fallback.
# /api/restful/oauth2/* MUST precede /api/restful/* so OAuth callbacks route to oauth.ts.
[[redirects]]
  from = "/api/restful/oauth2/*"
  to = "/.netlify/functions/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/restful/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth2/*"
  to = "/.netlify/functions/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login/oauth2/*"
  to = "/.netlify/functions/oauth/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
