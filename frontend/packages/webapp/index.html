<!doctype html>
<html lang="zh-CN">
  <head>
    <title>WiseMapping - 思维导图</title>
    <meta charset="utf-8" />
    <!-- The theme's background from the first paint, before the app loads: the mode the user
         chose (ThemeContext stores it), or the system's. Without it every full page load, as
         signing in has, flashed white in dark mode. The colours are the theme's
         background.default (src/theme), which a unit test keeps in sync. -->
    <script id="theme-preload">
      (function () {
        var mode;
        try {
          mode = localStorage.getItem('themeMode');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        var root = document.documentElement;
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === 'dark' ? '#2a2a2a' : '#fafafa';
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />

    <!-- Preconnect to font domains for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load fonts asynchronously with font-display: swap to prevent render blocking -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      crossorigin
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="WiseMapping 个人私有版思维导图，极简、高效。"
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Critical CSS for LCP element (Welcome heading) to reduce render delay -->
    <style>
      /* Critical styles for LCP element - prevents render blocking */
      h1.MuiTypography-h4 {
        font-family:
          'Figtree',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          sans-serif;
        font-weight: 400;
        font-size: 2.125rem;
        line-height: 1.235;
        letter-spacing: 0.00735em;
        margin: 0;
      }

      /* Prevent layout shift during font load */
      body {
        font-family:
          'Figtree',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          sans-serif;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO meta tags are now handled dynamically by React components -->

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Mobile Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WiseMapping" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="mindplot-div-container"></div>
    <script type="module" src="/src/index.tsx"></script>

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
