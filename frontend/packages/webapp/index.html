<!doctype html>
<html lang="en">
  <head>
    <title>WiseMapping - Free & Open-Source Mind Mapping</title>
    <meta charset="utf-8" />
    <!-- The theme's background from the first paint, before the app loads: the mode the user
         chose (ThemeContext stores it), or the system's. Without it every full page load, as
         signing in has, flashed white in dark mode. The colours are the theme's
         background.default (src/theme), which a unit test keeps in sync. -->
    <script id="theme-preload">
      (function () {
        var mode;
        try {
          mode = localStorage.getItem('themeMode');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        var root = document.documentElement;
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === 'dark' ? '#2a2a2a' : '#fafafa';
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />

    <!-- Preconnect to font domains for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.wisemapping.com" />

    <!-- Load fonts asynchronously with font-display: swap to prevent render blocking -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      crossorigin
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
    <!-- Noto Sans JP (about 150 KB of font rules) only for Japanese and Chinese: same order as
         AppI18n (URL prefix, saved choice, browser language). -->
    <script>
      (function () {
        var prefix = /^\/(ja|zh|zh-CN)\//.exec(window.location.pathname);
        var saved = null;
        try {
          saved = localStorage.getItem('user.locale');
        } catch (e) {}
        var locale = (prefix && prefix[1]) || saved || navigator.language || '';
        if (/^(ja|zh)/i.test(locale)) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href =
            'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap';
          document.head.appendChild(link);
        }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="WiseMapping is a free, fast and simple online mind mapping editor for individuals and business. Sign up to start organizing and sharing your ideas and thoughts."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.wisemapping.com/" />
    <meta property="og:title" content="WiseMapping - Free Online Mind Mapping App" />
    <meta
      property="og:description"
      content="Create, share and collaborate on visual mind maps for free. Sign up and start organizing your ideas with WiseMapping."
    />
    <meta property="og:image" content="https://www.wisemapping.com/img/icon-wise.png" />
    <meta property="og:site_name" content="WiseMapping" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@WiseMapping" />
    <meta name="twitter:title" content="WiseMapping - Free Online Mind Mapping App" />
    <meta
      name="twitter:description"
      content="Create, share and collaborate on visual mind maps for free. Sign up and start organizing your ideas with WiseMapping."
    />
    <meta name="twitter:image" content="https://www.wisemapping.com/img/icon-wise.png" />

    <!-- Critical CSS for LCP element (Welcome heading) to reduce render delay -->
    <style>
      /* Critical styles for LCP element - prevents render blocking */
      h1.MuiTypography-h4 {
        font-family:
          'Figtree',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          sans-serif;
        font-weight: 400;
        font-size: 2.125rem;
        line-height: 1.235;
        letter-spacing: 0.00735em;
        margin: 0;
      }

      /* Prevent layout shift during font load */
      body {
        font-family:
          'Figtree',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          sans-serif;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO meta tags are now handled dynamically by React components -->

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Mobile Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WiseMapping" />
  </head>
