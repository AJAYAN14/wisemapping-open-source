<!doctype html>
<html lang="zh-CN">
  <head>
    <title>WiseMapping - 免费开源思维导图</title>
    <meta charset="utf-8" />
    <!-- The theme's background from the first paint, before the app loads: the mode the user
         chose (ThemeContext stores it), or the system's. Without it every full page load, as
         signing in has, flashed white in dark mode. The colours are the theme's
         background.default (src/theme), which a unit test keeps in sync. -->
    <script id="theme-preload">
      (function () {
        var mode;
        try {
          mode = localStorage.getItem('themeMode');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        var root = document.documentElement;
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === 'dark' ? '#2a2a2a' : '#fafafa';
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />

    <!-- Preconnect to font domains for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load fonts asynchronously with font-display: swap to prevent render blocking -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      crossorigin
    />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      crossorigin
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block"
      />
    </noscript>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="WiseMapping 个人私有版思维导图，极简、高效。" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Critical CSS for LCP element (Welcome heading) to reduce render delay -->
    <style>
      /* Critical styles for LCP element - prevents render blocking */
      h1.MuiTypography-h4 {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei UI',
          'Microsoft YaHei',
          'Figtree',
          system-ui,
          sans-serif;
        font-weight: 600;
        font-size: 2.125rem;
        line-height: 1.235;
        letter-spacing: -0.015em;
        margin: 0;
      }

      /* Prevent layout shift during font load */
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei UI',
          'Microsoft YaHei',
          'Figtree',
          system-ui,
          sans-serif;
      }

      /* Google Fonts Material Symbols Rounded base metrics (prevents ligature text leakage) */
      .material-symbols-rounded {
        font-family: 'Material Symbols Rounded';
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        width: 1em;
        height: 1em;
        overflow: hidden;
        user-select: none;
        flex-shrink: 0;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'liga';
      }

      .material-symbols-rounded::before {
        content: attr(data-icon);
        font-family: inherit;
        font-feature-settings: inherit;
        font-variation-settings: inherit;
        line-height: 1;
      }
    </style>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO meta tags are now handled dynamically by React components -->

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="WiseMapping - 免费开源思维导图" />
    <meta property="og:description" content="WiseMapping 个人私有版思维导图，极简、高效。" />

    <!-- Mobile Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WiseMapping" />
  </head>
